name: Build and deploy

on:
  push:
    branches: [main]
  # Nightly at 5:05 UTC (12:05 a.m. EST / 1:05 a.m. EDT): add new matches,
  # pull results still missing, and rebuild for the new day's homepage.
  schedule:
    - cron: "5 5 * * *"
    # Temporary finals refresh: Oct 28, 2026, 9:03 a.m.–3:53 p.m. EDT.
    # The gate below checks the year and stops work once live is false.
    - cron: "3,13,23,33,43,53 13-19 28 10 *"
    # Final build at 4 p.m. EDT, even if cards remain incomplete.
    - cron: "0 20 28 10 *"
  workflow_dispatch:

permissions:
  contents: write # commit refreshed scores back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NIGHTLY: ${{ github.event_name == 'schedule' && github.event.schedule == '5 5 * * *' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Check temporary championship refresh window
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$SCHEDULE" = "5 5 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%F)" = "2026-10-28" ] && ! grep -q '^live: false$' _events/2026-10-26-state-championships.md; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1 # version from .tool-versions
        with:
          bundler-cache: true

      - name: Add new events from the results page
        if: env.NIGHTLY == 'true'
        run: bundle exec bin/import

      - name: Refresh scores
        run: bundle exec bin/refresh ${{ env.NIGHTLY == 'true' && '--missing' || '' }}

      - name: End championship refresh when complete or at 4 p.m. ET
        run: bundle exec ruby bin/finish-championship

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain _data/scores _events)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scores _events
          git commit -m "Update scores and events"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to deploy
        id: decide
        run: echo "deploy=${{ github.event_name != 'schedule' || env.NIGHTLY == 'true' || steps.commit.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.decide.outputs.deploy == 'true'
        run: bundle exec rake test

      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'
        id: pages

      - name: Build site
        if: steps.decide.outputs.deploy == 'true'
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v4
        if: steps.decide.outputs.deploy == 'true'

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
