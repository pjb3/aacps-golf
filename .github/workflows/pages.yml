name: Build and deploy

on:
  push:
    branches: [main]
  # Every 15 minutes: re-download the sheets for today's events (see
  # Golf::Schedule.live?). GitHub may delay scheduled runs by several minutes;
  # use "Run workflow" for an immediate refresh.
  # Nightly, just after midnight Eastern (EDT and EST): add new matches from
  # the results page, pull results still missing, and rebuild so the
  # homepage's Today/Upcoming/Past sections roll over.
  schedule:
    # Offset from the busy quarter-hour marks to reduce scheduling delays.
    - cron: "7,22,37,52 * * * *"
    - cron: "5 4 * * *"
    - cron: "5 5 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit refreshed scores back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NIGHTLY: ${{ github.event_name == 'schedule' && github.event.schedule != '7,22,37,52 * * * *' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1 # version from .tool-versions
        with:
          bundler-cache: true

      - name: Add new events from the results page
        if: env.NIGHTLY == 'true'
        run: bundle exec bin/import

      - name: Refresh scores
        run: bundle exec bin/refresh ${{ env.NIGHTLY == 'true' && '--missing' || '' }}

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain _data/scores _events)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scores _events
          git commit -m "Update scores and events"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 15-minute runs only redeploy when something changed.
      - name: Decide whether to deploy
        id: decide
        run: echo "deploy=${{ github.event_name != 'schedule' || env.NIGHTLY == 'true' || steps.commit.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.decide.outputs.deploy == 'true'
        run: bundle exec rake test

      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'
        id: pages

      - name: Build site
        if: steps.decide.outputs.deploy == 'true'
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v4
        if: steps.decide.outputs.deploy == 'true'

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
