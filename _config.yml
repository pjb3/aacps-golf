title: AACPS Golf
description: Live leaderboards and results for Anne Arundel County Public Schools golf.
timezone: America/New_York
# Upcoming events are dated in the future; publish them anyway.
future: true

collections:
  events:
    output: true
    permalink: /:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - HANDOFF.md
  - bin
  - lib
  - sample
  - test
  - vendor
  - .tool-versions

defaults:
  - scope: { type: events }
    values: { layout: event }
